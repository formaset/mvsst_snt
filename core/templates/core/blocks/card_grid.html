{% load wagtailimages_tags %}
<section class="section">
  <div class="container">
    {% if value.heading %}<h2>{{ value.heading }}</h2>{% endif %}
    <div class="card-grid">
      {% for card in value.cards %}
        <div class="card">
          {% if card.image %}
            {% image card.image fill-360x240 class="card-image" %}
          {% else %}
            <div class="card-image placeholder"></div>
          {% endif %}
          <div class="card-body">
            <h3>{{ card.title }}</h3>
            {% if card.text %}<p>{{ card.text }}</p>{% endif %}
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
